<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marvel | Black Panther</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="pagina">
    
    <header class="cabecalho">
        <img
            src="imagens/marvel-logo.png"
            alt="Marvel"
            class="logo"
        >
        
        <nav class="pontos" aria-label="Navegação">
            <span></span>
            <span></span>
            <span class="ativo"></span>
            <span></span>
            <span></span>
        </nav>
        
        <div
            class="pesquisa"
            role="img"
            aria-label="Pesquisar"
        ></div>
    </header>
    
    <section class="cartao">
       
        <div class="conteudo">
            <p class="categoria">HERO</p>
            <h1>
                BLACK<br>
                PANTHER
            </h1>
            
            <button class="botao" type="button">
                VIBRANIUM
            </button>
            
            <div class="video">
                <img
                    src="imagens/video.png"
                    alt="Imagem do Pantera Negra"
                >
                <span class="play" aria-hidden="true">▶</span>
            </div>
        </div>
        
        <img
            src="imagens/pantera-negra.png"
            alt="Pantera Negra"
            class="personagem"
        >
    </section>
</main>
</body>
</html>
